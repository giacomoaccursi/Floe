name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  SPARK_LOCAL_IP: "127.0.0.1"
  JAVA_OPTS: "-Xmx2G"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git

      - name: Compile
        run: sbt -J-Xss4m compile

      - name: Test
        run: sbt -J-Xss4m test

      - name: Verify published runtime ownership
        run: |
          sbt -J-Xss4m makePom
          pom=$(find target/scala-2.12 -maxdepth 1 -name '*.pom' -print -quit)
          test -n "$pom"
          rg -U '<artifactId>iceberg-spark-runtime-3\.5_2\.12</artifactId>\s*<version>1\.10\.1</version>\s*<scope>provided</scope>' "$pom"
          if rg -q '<artifactId>iceberg-aws-bundle</artifactId>' "$pom"; then
            echo 'iceberg-aws-bundle must be supplied by the deployment, not Floe' >&2
            exit 1
          fi

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: success()
        run: sbt -J-Xss4m publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  back-merge:
    name: Merge back to develop
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge origin/main --no-edit
          git push origin develop
